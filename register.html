<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — Flower Market</title>
  <meta name="description" content="Join the Flower Market community to enjoy 15% off your first bouquet, access member discounts, and track delivery routes.">

  <!-- Google Fonts: Noto Serif & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles/flower.css">
</head>

<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at top center, var(--color-primary-tint) 0%, var(--bg-body) 70%);">

  <header style="padding: 1.5rem 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-link">
        <img src="assets/logo.png" alt="Flower Market Logo" class="brand-logo">
        <span class="brand-name">Flower <span>Market</span></span>
      </a>
      <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark/light theme">
        <i class="fas fa-moon"></i> <span class="theme-label">Dark Mode</span>
      </button>
    </div>
  </header>

  <main class="container" style="max-width: 480px; margin: 2rem auto; width: 100%;">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-circle"><i class="fas fa-seedling text-secondary-color"></i></div>
        <h1 class="auth-title">Join Floral Club</h1>
        <p class="auth-subtitle">Create your botanical account to receive 15% off your first order.</p>
      </div>

      <div id="register-alert" class="form-error-banner is-hidden" role="alert"></div>

      <form id="register-form" novalidate aria-label="Account Registration Form">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name *</label>
          <div class="input-with-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Eleanor Vance" autocomplete="name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address *</label>
          <div class="input-with-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="reg-email" class="form-input" placeholder="e.g. eleanor@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Create Password *</label>
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" autocomplete="new-password" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password *</label>
          <div class="input-with-icon">
            <i class="fas fa-shield-check"></i>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-type your password" autocomplete="new-password" required>
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer; line-height: 1.5;">
            <input type="checkbox" required checked style="margin-top: 3px;">
            <span>I agree to Flower Market’s <a href="privacy.html" style="color: var(--color-primary); text-decoration: underline;">Terms of Service</a> & <a href="privacy.html" style="color: var(--color-primary); text-decoration: underline;">Privacy Policy</a>.</span>
          </label>
        </div>

        <button type="submit" class="btn btn--primary" id="register-submit-btn" style="width: 100%; height: 48px; font-size: 1rem;">
          <i class="fas fa-user-plus"></i> <span>Create Account</span>
        </button>
      </form>

      <div class="auth-divider"><span>OR REGISTER WITH</span></div>

      <div class="social-login-grid">
        <button type="button" class="btn btn--outline social-login-btn" data-provider="Google">
          <i class="fab fa-google text-primary-color"></i> <span>Google</span>
        </button>
        <button type="button" class="btn btn--outline social-login-btn" data-provider="Facebook">
          <i class="fab fa-facebook-f" style="color: #1877F2;"></i> <span>Facebook</span>
        </button>
      </div>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
    </div>
  </main>

  <footer style="padding: 1.5rem 0; text-align: center; font-size: 0.8125rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle);">
    <p>&copy; 2026 Flower Market Inc. All rights reserved.</p>
  </footer>

  <script src="scripts/auth.js"></script>
  <script>
    const theme = localStorage.getItem('fm_theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fm_theme', next);
      document.getElementById('theme-toggle').querySelector('i').className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    });
  </script>
</body>

</html>
