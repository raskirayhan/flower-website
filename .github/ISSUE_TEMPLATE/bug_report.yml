name: 🐛 Bug Report
description: File a bug report for FixItNow / Flower Market platform
title: '[BUG]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Component
      options:
        - Frontend (UI / Pages)
        - Backend (API / Controllers)
        - Database (Prisma / Models)
        - AI Concierge / Search
        - Payment / Stripe
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: 1. Go to '/explore'\n2. Filter by category\n3. Observe behavior
    validations:
      required: true
